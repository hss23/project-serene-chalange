# Pings the API health check on a schedule. This wakes the free Render instance and runs a
# Supabase query, so the free Supabase project isn't paused for inactivity during review.
# Set the repository variable API_URL (Settings → Secrets and variables → Actions → Variables).
name: keepalive

on:
  schedule:
    - cron: "17 */12 * * *" # twice a day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "${{ vars.API_URL }}/api/health") || true
            cat /tmp/body; echo " [$code]"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
