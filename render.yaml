# Render Blueprint for the Express API (backend/). Frontend deploys separately on Vercel (frontend/).
services:
  - type: web
    name: serene-mentors-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        sync: false # e.g. https://<your-app>.vercel.app,http://localhost:3000
      - key: FIREBASE_ADMIN_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false # comma-separated admin emails, e.g. admin@serene-demo.test
      - key: TEACHER_AUTO_APPROVE
        value: "false"
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: MINIMAL
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: RAG_MIN_SIMILARITY
        value: "0.65"
      - key: CHAT_HOURLY_LIMIT
        value: "30"
